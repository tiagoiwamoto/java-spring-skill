spring.application.name=pedidos-kafka

# Tópico usado por POST /pedidos/eventos
pedidos.kafka.topic.eventos=${PEDIDOS_KAFKA_TOPIC_EVENTOS:pedidos-eventos}

# Producer de texto puro (PLAINTEXT)
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
kafka.plain.acks=${KAFKA_PLAIN_ACKS:all}
kafka.plain.retries=${KAFKA_PLAIN_RETRIES:3}
kafka.plain.delivery.timeout.ms=${KAFKA_PLAIN_DELIVERY_TIMEOUT_MS:120000}

# Producer SSL com Avro e Schema Registry
kafka.ssl.bootstrap.servers=${KAFKA_SSL_BOOTSTRAP_SERVERS:localhost:9093}
kafka.ssl.schema.registry.url=${KAFKA_SSL_SCHEMA_REGISTRY_URL:http://localhost:8081}
kafka.ssl.acks=${KAFKA_SSL_ACKS:all}
kafka.ssl.retries=${KAFKA_SSL_RETRIES:3}
kafka.ssl.endpoint.identification.algorithm=${KAFKA_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM:https}
# Quando vazio, o producer usa ${java.home}/lib/security/cacerts
kafka.ssl.truststore.location=${KAFKA_SSL_TRUSTSTORE_LOCATION:}
# Senha do truststore; "changeit" é apenas o default do cacerts do JDK para desenvolvimento local
kafka.ssl.truststore.password=${KAFKA_SSL_TRUSTSTORE_PASSWORD:changeit}
